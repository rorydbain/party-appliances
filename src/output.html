<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src party: data:; media-src party:; connect-src 'self' party:; object-src 'none'">
  <title>Loop — Output</title>
  <link rel="stylesheet" href="readout.css">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
    #stage{width:100%;height:100%;position:relative}
    #stage.single>img,#stage.single>video{width:100%;height:100%;position:absolute;inset:0;object-fit:contain;opacity:0;transition:opacity .8s ease}
    #stage.single>img.visible,#stage.single>video.visible{opacity:1}
    #stage.grid{--gap:clamp(4px,.6vw,12px);display:block;box-sizing:border-box;background:#000}
    .grid-tile{position:absolute;overflow:hidden;contain:strict;isolation:isolate;background:#090909;min-width:0;min-height:0;opacity:0;transform:scale(.992);transition:left 1.25s cubic-bezier(.22,.72,.2,1),top 1.25s cubic-bezier(.22,.72,.2,1),width 1.25s cubic-bezier(.22,.72,.2,1),height 1.25s cubic-bezier(.22,.72,.2,1),opacity .65s ease,transform 1.25s ease}
    .grid-tile[data-active="true"]{opacity:1;transform:none}
    .grid-tile::before{content:"";position:absolute;z-index:0;inset:-9%;background-image:var(--backdrop);background-position:center;background-size:cover;filter:blur(clamp(16px,2vw,34px)) brightness(.56) saturate(.82);transform:scale(1.08);opacity:0;transition:opacity .8s ease}
    .grid-tile[data-soft-fill="true"]::before{opacity:1}
    .grid-tile img,.grid-tile video{display:block;position:absolute;z-index:1;inset:0;max-width:100%;max-height:100%;width:100%;height:100%;opacity:0;transition:opacity .8s ease}
    .grid-tile img.visible,.grid-tile video.visible{opacity:1}
    #curtain{position:fixed;inset:0;background:#000;z-index:10}
    #curtain[hidden]{display:none}
    @media(prefers-reduced-motion:reduce){.grid-tile,.grid-tile img,.grid-tile video{transition:none}}
  </style>
</head>
<body><div id="stage"></div><div id="metadata-readout" class="metadata-readout" hidden></div><div id="curtain" hidden></div><script src="readout.js"></script><script src="playback.js"></script><script src="output.js"></script></body>
</html>
